<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Syne:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page">
    <header class="brand">
      <p class="brand__name">CASIO</p>
      <p class="brand__tag">simple CALCULATOR</p>
    </header>

    <section class="calculator" aria-label="Calculator">
      <div class="display">
        <div class="display__expression" id="expression" aria-live="polite"></div>
        <div class="display__value" id="display">0</div>
      </div>

      <div class="keys">
        <button type="button" class="key key--muted" data-action="clear">C</button>
        <button type="button" class="key key--muted" data-action="backspace">⌫</button>
        <button type="button" class="key key--op" data-operator="/">÷</button>
        <button type="button" class="key key--op" data-operator="*">×</button>

        <button type="button" class="key" data-digit="7">7</button>
        <button type="button" class="key" data-digit="8">8</button>
        <button type="button" class="key" data-digit="9">9</button>
        <button type="button" class="key key--op" data-operator="-">−</button>

        <button type="button" class="key" data-digit="4">4</button>
        <button type="button" class="key" data-digit="5">5</button>
        <button type="button" class="key" data-digit="6">6</button>
        <button type="button" class="key key--op" data-operator="+">+</button>

        <button type="button" class="key" data-digit="1">1</button>
        <button type="button" class="key" data-digit="2">2</button>
        <button type="button" class="key" data-digit="3">3</button>
        <button type="button" class="key key--equals" data-action="equals">=</button>

        <button type="button" class="key key--zero" data-digit="0">0</button>
        <button type="button" class="key" data-action="dot">.</button>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
